# Zero-credential judge path: `docker compose up --build`
# Console at http://localhost:5173, API at http://localhost:8000.
# Mock mode: live dialing off; the seeded run is a scrubbed real recorded call.
services:
  api:
    build: .
    ports:
      - "8000:8000"
    environment:
      ATTEST_USE_MOCK: "true"
      ATTEST_MOCK_BASE_URL: "http://mock:8100"
      ATTEST_DB_PATH: "/app/data/attest.db"
      ATTEST_JUDGE_KEY: "demo-mode-key"
      # Demo signing key so the zero-credential judge path serves SIGNED
      # attestations; production uses a real secret.
      # "demo" selects a deliberately public deterministic signing key so
      # the judge path serves verifiable certificates; production sets a
      # real secret whose PUBLIC half is committed at
      # docs/attestation-public-key.pem.
      ATTEST_SIGNING_KEY_ED25519: "demo"
      ATTEST_AUDIO_DIR: "/app/data/audio"
      # Off by default: the judge path never fabricates call audio. CI's e2e
      # job sets 1 so the waveform gets exercised with an honestly labeled
      # synthetic alignment tone.
      ATTEST_SEED_TEST_TONE: "${ATTEST_SEED_TEST_TONE:-0}"
    depends_on:
      - mock

  mock:
    build: .
    command: ["uv", "run", "uvicorn", "mock_calle.server:app", "--host", "0.0.0.0", "--port", "8100"]
    ports:
      - "8100:8100"

  web:
    image: node:22-slim
    working_dir: /web
    volumes:
      - ./frontend:/web
      - /web/node_modules
    environment:
      VITE_API_BASE: "http://localhost:8000"
      CI: "true"
    command: sh -c "corepack enable && pnpm install && pnpm dev --host 0.0.0.0"
    ports:
      - "5173:5173"
    depends_on:
      - api
