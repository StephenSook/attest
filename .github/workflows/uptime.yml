name: uptime
on:
  schedule:
    - cron: "23 * * * *"
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: frontend/package.json
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: Backend healthz
        run: |
          set -euo pipefail
          body="$RUNNER_TEMP/health.json"
          curl -sfL --max-redirs 3 --max-time 30 --retry 3 --retry-delay 20 \
            https://attest-api-o5gm.onrender.com/healthz -o "$body"
          test -s "$body"
          jq -e \
            '.status == "ok" and .service == "attest" and .poller == "running" and .provider == "live" and .sandbox == "disabled"' \
            "$body"
      - name: Frontend renders the judged path
        working-directory: frontend
        env:
          E2E_BASE_URL: https://attest-web-phi.vercel.app
          E2E_BROWSER_CHANNEL: chrome
        run: |
          set -euo pipefail
          command -v google-chrome
          pnpm install --frozen-lockfile
          pnpm exec playwright test --config production-e2e/playwright.config.ts
      - name: Replay run served
        run: |
          set -euo pipefail
          body="$RUNNER_TEMP/replay.json"
          curl -sfL --max-redirs 3 --max-time 30 \
            https://attest-api-o5gm.onrender.com/api/runs/run_replay_probe_0001 -o "$body"
          test -s "$body"
          jq -e \
            '.run_id == "run_replay_probe_0001" and .state == "completed" and .analysis.replay == true and .payload.status == "completed"' \
            "$body"
      - name: Attestation key matches the repository
        run: |
          set -euo pipefail
          key="$RUNNER_TEMP/attestation-public-key.pem"
          curl -sfL --max-redirs 3 --max-time 30 \
            https://attest-api-o5gm.onrender.com/api/attestation-key -o "$key"
          test -s "$key"
          cmp "$key" docs/attestation-public-key.pem
      - name: Judge distribution links remain live
        run: |
          set -euo pipefail
          testflight="$RUNNER_TEMP/testflight.html"
          video="$RUNNER_TEMP/video.json"
          curl -sfL --max-redirs 3 --max-time 30 \
            https://testflight.apple.com/join/XZDXt7jw -o "$testflight"
          grep -Fq 'Attest Pocket' "$testflight"
          curl -sfL --max-redirs 3 --max-time 30 \
            'https://www.youtube.com/oembed?url=https://www.youtube.com/watch?v=o-qZfT4XexU&format=json' \
            -o "$video"
          jq -e '.title == "Attest - the phone agent that refuses to guess"' "$video"
