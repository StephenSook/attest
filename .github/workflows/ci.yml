name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: uv sync
      - name: Lint
        run: uv run ruff check .
      - name: Format check
        run: uv run ruff format --check .
      - name: Typecheck
        run: uv run mypy
      - name: Tests
        run: uv run pytest -q

  mobile:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - name: Install
        run: npm ci
      - name: Typecheck
        run: npx tsc --noEmit
      - name: Test
        run: node --experimental-strip-types --test "src/**/*.test.ts"

  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 10
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Typecheck and build
        run: pnpm build

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Start the compose stack
        run: docker compose up -d --build api mock
        env:
          # CI-only: seed an honestly labeled synthetic tone so the waveform
          # player gets exercised end to end. Never set on any deployed path.
          ATTEST_SEED_TEST_TONE: '1'
      - uses: pnpm/action-setup@v6
        with:
          version: 10
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: Install and build frontend
        working-directory: frontend
        run: pnpm install --frozen-lockfile
      - name: Start web dev server
        working-directory: frontend
        run: nohup pnpm dev --host 0.0.0.0 > /tmp/web.log 2>&1 &
      - name: Install Playwright browsers
        working-directory: frontend
        run: npx playwright install --with-deps chromium
      - name: Wait for services
        run: |
          set -euo pipefail
          for i in $(seq 1 60); do
            curl -sf localhost:8000/healthz > /dev/null && curl -sf localhost:5173 > /dev/null && exit 0
            sleep 2
          done
          echo "services never came up" >&2
          docker compose logs api | tail -20 >&2
          exit 1
      - name: Run e2e suite
        working-directory: frontend
        run: npx playwright test
        env:
          E2E_EXPECT_AUDIO: '1'
